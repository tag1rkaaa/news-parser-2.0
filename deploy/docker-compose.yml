services:
  newsparser:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: newsparser:2.0
    container_name: newsparser
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    command: ["--loop=600"]
    ports:
      - "8000:8000"  # /metrics
    volumes:
      - ../logs:/app/logs
    deploy:
      resources:
        limits: {memory: 512M}
        reservations: {memory: 256M}

  alert_watcher:
    image: newsparser:2.0
    container_name: newsparser-alerts
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      newsparser: {condition: service_started}
      redis:      {condition: service_healthy}
    entrypoint: ["python", "-m", "services.alert_watcher"]
    volumes:
      - ../logs:/app/logs
    deploy:
      resources:
        limits: {memory: 128M}
        reservations: {memory: 64M}

  redis:
    image: redis:7-alpine
    container_name: newsparser-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: newsparser-rabbitmq
    restart: unless-stopped
    ports:
      - "15672:15672"  # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    deploy:
      resources:
        limits: {memory: 256M}
        reservations: {memory: 128M}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: newsparser-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      newsparser: {condition: service_started}

  grafana:
    image: grafana/grafana:11.2.0
    container_name: newsparser-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus: {condition: service_started}

volumes:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  grafana-data:
