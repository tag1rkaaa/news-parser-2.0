[project]
name = "newsparser"
version = "2.0.0"
description = "Scrapy-based Russian news monitor with async I/O and Prometheus metrics"
requires-python = ">=3.14"
readme = "README.md"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["newsparser*", "services*"]

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["newsparser/spiders/_examples"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # flake8-bugbear
    "UP",            # pyupgrade
    "SIM",           # flake8-simplify
    "RUF",
    "ASYNC",
    "PL",            # pylint subset
]
ignore = ["PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"newsparser/spiders/*" = ["E501"]  # legacy spiders — long CSS selectors

[tool.black]
line-length = 110
target-version = ["py314"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["newsparser/spiders/(?!_examples).*"]

[[tool.mypy.overrides]]
module = ["scrapy.*", "itemadapter.*", "twisted.*", "feedparser.*"]
ignore_missing_imports = true
